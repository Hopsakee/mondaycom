[project]
name = "mondaycom"
version = "0.2.0"
description = "Command-line tools for working with monday.com from Jelle's terminal and Obsidian vault"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.1",
    "python-fasthtml>=0.14.13",
    "requests>=2.32.3",
]

[project.scripts]
monday = "mondaycom.cli:main"

[project.urls]
repository = "https://github.com/Hopsakee/mondaycom"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mondaycom"]

[dependency-groups]
dev = [
    "mypy>=1.11.2",
    "poethepoet>=0.29.0",
    "pre-commit>=4.6.2",
    "pytest>=8.3.3",
    "ruff>=0.6.8",
    "types-requests>=2.32.0",
]
# Only needed to open the frozen exploration notebooks under nbs/legacy/.
notebook = [
    "ipykernel>=6.29.5",
]

[tool.ruff]
line-length = 120
target-version = "py310"
output-format = "concise"
# nbs/ is a frozen exploration record and docs/ is a vendored copy of monday.com's
# documentation — neither is ours to reformat.
extend-exclude = ["nbs", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PERF", "UP", "C4", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["mondaycom"]

[tool.mypy]
mypy_path = "src"
strict = true
platform = "linux"
explicit_package_bases = true
show_column_numbers = true
allow_redefinition = true

# FastHTML and its Starlette-flavoured stack ship no py.typed marker.
[[tool.mypy.overrides]]
module = ["fasthtml.*", "uvicorn.*"]
ignore_missing_imports = true

# `@rt` therefore reads as an untyped decorator, which would flag every route.
[[tool.mypy.overrides]]
module = "mondaycom.web"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
console_output_style = "classic"
addopts = "--tb native --import-mode=importlib"

[tool.poe]
verbosity = 0

[tool.poe.tasks]
_ruff = "uv run ruff check --output-format=concise"
_check_format = "uv run ruff format --diff"
_mypy = "uv run mypy src"
_pytest = "uv run pytest"

[tool.poe.tasks.format]
help = "Reformat all Python files"
cmd = "uv run ruff format src tests"

[tool.poe.tasks.check]
help = "Run formatting, linting, and type checks"
sequence = ["_check_format", "_ruff", "_mypy"]

[tool.poe.tasks.test]
help = "Run the test suite"
sequence = ["_pytest"]

[tool.poe.tasks.clean]
help = "Remove build and cache artifacts"
cmd = """
  rm -rf .coverage .mypy_cache .pytest_cache ./**/__pycache__ .ruff_cache
"""
